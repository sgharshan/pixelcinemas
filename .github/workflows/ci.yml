name: Pixel Cinemas CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/pixel-cinemas-ci
      JWT_SECRET: ci-only-secret-with-at-least-24-characters
      CLIENT_ORIGIN: http://127.0.0.1:5173
      SEED_ADMIN_PASSWORD: CI-Admin-Password-123!
      VITE_API_URL: http://127.0.0.1:3000/api
      VITE_SOCKET_URL: http://127.0.0.1:3000
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
